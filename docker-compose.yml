version: "3.8"

services:
  openclaw-voice:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    container_name: openclaw-voice
    ports:
      - "8765:8765"
    environment:
      OPENCLAW_HOST: "0.0.0.0"
      OPENCLAW_PORT: "8765"

      OPENCLAW_GATEWAY_URL: "http://172.17.0.1:18789"
      OPENCLAW_GATEWAY_TOKEN: "ae49fd879155471b4562a6e829ad4a9f9ec117ce3b0e2a17"

      OPENCLAW_STT_MODEL: "base"
      OPENCLAW_STT_DEVICE: "cpu"

      OPENCLAW_TTS_MODEL: "chatterbox"

      OPENCLAW_REQUIRE_AUTH: "true"
      OPENCLAW_MASTER_KEY: "bbb117e1d5cc133dbdad0c804e314611158e81a09796b844c9d8e5f886aab2fd"

      OPENAI_API_KEY: ""
      ELEVENLABS_API_KEY: ""
    volumes:
      - whisper-models:/root/.cache/huggingface
      - ./voices:/app/voices
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  whisper-models:
